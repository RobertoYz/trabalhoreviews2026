<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews de Jogos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container-principal">
    <header>
        <h1>Minhas Reviews:</h1>
        <button onclick="logout()" class="botao-sair">Sair</button>
    </header>

    <section class="formulario-jogo">
        <h2>Adicionar/Editar Review</h2>
        <form id="formularioJogo">
            <input type="hidden" id="jogoId">
            <div class="grupo-input">
                <label for="nomeJogo">Nome do Jogo:</label>
                <input type="text" id="nomeJogo" required>
            </div>
            <div class="grupo-input">
                <label for="tipoJogo">Tipo:</label>
                <input type="text" id="tipoJogo" required>
            </div>
            <div class="grupo-input">
                <label for="notaJogo">Nota (0-10):</label>
                <input type="number" id="notaJogo" min="0" max="10" required>
            </div>
            <div class="grupo-input">
                <label for="reviewJogo">Review:</label>
                <textarea id="reviewJogo" rows="4"></textarea>
            </div>
            <button type="submit" id="botaoSalvar">Salvar</button>
        </form>
    </section>

    <section class="lista-jogos">
        <h2>Jogos Cadastrados</h2>
        <div id="containerJogos"></div>
    </section>
</div>
<script src="js/script.js"></script>
</body>
</html>
